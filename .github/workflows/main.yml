name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build AGMLIB
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AGMLIB.sln

      - name: Build release
        run: >-
          dotnet build AGMLIB.sln
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:DeployToGame=false

      - name: Verify build outputs
        shell: pwsh
        run: |
          $requiredOutputs = @(
            "artifacts/AGMLIB/ModInfo.xml"
            "artifacts/AGMLIB/Release/net481/AGMLIB.dll"
            "artifacts/AGMLIB/Release/net481/0Harmony.dll"
          )

          foreach ($output in $requiredOutputs) {
            if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              throw "Required build output was not created: $output"
            }
          }

      - name: Upload AGMLIB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGMLIB-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/AGMLIB/ModInfo.xml
            artifacts/AGMLIB/Release/net481/AGMLIB.dll
            artifacts/AGMLIB/Release/net481/AGMLIB.pdb
            artifacts/AGMLIB/Release/net481/0Harmony.dll
