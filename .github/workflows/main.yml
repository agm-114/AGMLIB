name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build AGMLIB (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AGMLIB.sln

      - name: Build ${{ matrix.configuration }}
        run: >-
          dotnet build AGMLIB.sln
          --configuration ${{ matrix.configuration }}
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:DeployToGame=false
          -p:PowerShellExecutable=pwsh

      - name: Validate package
        shell: pwsh
        run: |
          ./scripts/CI/Test-AgmlibPackage.ps1 `
            -Configuration '${{ matrix.configuration }}' `
            -PackageRoot artifacts/AGMLIB `
            -ReportPath 'artifacts/ci/package-${{ matrix.configuration }}.json'

      - name: Test CI script contracts
        shell: pwsh
        run: |
          ./scripts/CI/Test-CiScripts.ps1 `
            -Configuration '${{ matrix.configuration }}' `
            -PackageRoot artifacts/AGMLIB `
            -ReportPath 'artifacts/ci/contracts-${{ matrix.configuration }}.json'

      - name: Verify build isolation
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/Build/Test-AgmlibBuildIsolation.ps1 -Configuration Release

      - name: Upload CI reports
        uses: actions/upload-artifact@v7
        with:
          name: AGMLIB-ci-reports-${{ matrix.configuration }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/ci/package-${{ matrix.configuration }}.json
            artifacts/ci/contracts-${{ matrix.configuration }}.json

      - name: Upload AGMLIB artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: AGMLIB-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/AGMLIB/ModInfo.xml
            artifacts/AGMLIB/Release/net481/AGMLIB.dll
            artifacts/AGMLIB/Release/net481/AGMLIB.pdb
            artifacts/AGMLIB/Release/net481/0Harmony.dll
